# Yığın bilerek küçük tutuluyor: derleme 3 GB bellekli VDS'de de yapılıyor ve
# büyük bir daemon orada takas alanına düşüp makineyi kilitliyor.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Kotlin derleyici ayrı bir JVM açıyor; 3 GB belleğin tamamını ona bırakmıyoruz.
kotlin.daemon.jvmargs=-Xmx1024m
